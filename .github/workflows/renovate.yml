name: Renovate Run

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry Run mode (lookup, full, or extract)'
        required: false
        default: 'lookup'
        type: choice
        options:
          - 'lookup'
          - 'full'
          - 'extract'
      logLevel:
        description: 'Log Level'
        required: false
        default: 'info'
        type: choice
        options:
          - 'info'
          - 'debug'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Renovate Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.14
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          LOG_LEVEL: ${{ inputs.logLevel }}
